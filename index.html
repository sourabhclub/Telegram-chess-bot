<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Arena</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    * { box-sizing: border-box; }body {
  margin: 0;
  padding: 20px 12px;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { color: #8de0b2; margin-bottom: 5px; }
p { color: #c8d2dc; }

.board {
  width: min(94vw, 440px);
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  margin: 20px auto;
  border: 3px solid #d1d5db;
  border-radius: 4px;
  overflow: hidden;
}

.square {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  cursor: pointer;
  font-size: clamp(27px, 8vw, 45px);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.light { background: #e8edf2; }
.dark { background: #719b83; }

.selected {
  background: #e8d45b !important;
}

.piece {
  line-height: 1;
  cursor: pointer;
}

.white-piece {
  color: #fff;
  text-shadow: 1px 2px 2px #333;
}

.black-piece {
  color: #20252b;
  text-shadow: 0 1px 1px #fff;
}

.legal::after {
  content: "";
  position: absolute;
  width: 24%;
  height: 24%;
  border-radius: 50%;
  background: #253b3580;
  pointer-events: none;
}

.capture::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 4px solid #b94b4b;
  border-radius: 50%;
  pointer-events: none;
}

.panel {
  max-width: 440px;
  margin: auto;
}

#status {
  background: #202d38;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  margin-bottom: 12px;
}

button {
  background: #8de0b2;
  color: #10251b;
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  margin: 5px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:active { transform: scale(.97); }

.note {
  font-size: 12px;
  color: #aab7c4;
  line-height: 1.5;
}

  </style>
</head>
<body>
  <h1>♟ Chess Arena</h1>
  <p>Interactive Chessboard</p>  <div class="panel">
    <div id="status">White to move</div>
    <div id="board" class="board"></div><button onclick="resetGame()">New Game</button>
<button onclick="flipBoard()">Flip Board</button>
<button onclick="undoMove()">Undo Move</button>

<p class="note">
  Tap a piece, then tap its destination square.<br>
  This is currently a local demo, not multiplayer.
</p>

  </div>  <script>
    const game = new Chess();
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");

    const symbols = {
      w: { k: "♔", q: "♕", r: "♖", b: "♗", n: "♘", p: "♙" },
      b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" }
    };

    let selectedSquare = null;
    let legalMoves = [];
    let flipped = false;

    function renderBoard() {
      boardElement.innerHTML = "";

      const files = flipped
        ? ["h","g","f","e","d","c","b","a"]
        : ["a","b","c","d","e","f","g","h"];

      const ranks = flipped
        ? [1,2,3,4,5,6,7,8]
        : [8,7,6,5,4,3,2,1];

      for (const rank of ranks) {
        for (const file of files) {
          const squareName = file + rank;
          const square = document.createElement("div");
          const isLight = (files.indexOf(file) + ranks.indexOf(rank)) % 2 === 0;

          square.className = "square " + (isLight ? "light" : "dark");
          square.dataset.square = squareName;

          if (selectedSquare === squareName) {
            square.classList.add("selected");
          }

          const piece = game.get(squareName);

          if (piece) {
            const span = document.createElement("span");
            span.className = "piece " +
              (piece.color === "w" ? "white-piece" : "black-piece");
            span.textContent = symbols[piece.color][piece.type];
            square.appendChild(span);
          }

          const move = legalMoves.find(m => m.to === squareName);

          if (move) {
            square.classList.add(piece ? "capture" : "legal");
          }

          square.addEventListener("click", () => handleSquareClick(squareName));
          boardElement.appendChild(square);
        }
      }

      updateStatus();
    }

    function handleSquareClick(squareName) {
      if (game.isGameOver()) return;

      const piece = game.get(squareName);

      if (selectedSquare) {
        const move = legalMoves.find(m => m.to === squareName);

        if (move) {
          try {
            game.move({
              from: selectedSquare,
              to: squareName,
              promotion: "q"
            });
          } catch (error) {
            // Ignore invalid moves.
          }

          selectedSquare = null;
          legalMoves = [];
          renderBoard();
          return;
        }
      }

      if (piece && piece.color === game.turn()) {
        selectedSquare = squareName;
        legalMoves = game.moves({
          square: squareName,
          verbose: true
        });
      } else {
        selectedSquare = null;
        legalMoves = [];
      }

      renderBoard();
    }

    function updateStatus() {
      if (game.isCheckmate()) {
        statusElement.textContent =
          "Checkmate! " + (game.turn() === "w" ? "Black" : "White") + " wins.";
      } else if (game.isDraw()) {
        statusElement.textContent = "Game drawn.";
      } else if (game.isCheck()) {
        statusElement.textContent =
          (game.turn() === "w" ? "White" : "Black") + " is in check!";
      } else {
        statusElement.textContent =
          (game.turn() === "w" ? "White" : "Black") + " to move";
      }
    }

    function resetGame() {
      game.reset();
      selectedSquare = null;
      legalMoves = [];
      renderBoard();
    }

    function flipBoard() {
      flipped = !flipped;
      renderBoard();
    }

    function undoMove() {
      game.undo();
      selectedSquare = null;
      legalMoves = [];
      renderBoard();
    }

    renderBoard();
  </script></body>
  </html>
