<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Arena</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px 10px;background:#101820;color:white;font-family:Arial,sans-serif;text-align:center}
h1{color:#8de0b2;margin-bottom:5px}
#status{background:#202d38;padding:13px;border-radius:9px;margin:15px auto;max-width:440px}
#board{width:min(94vw,440px);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));margin:15px auto;border:2px solid #ddd;box-sizing:border-box;overflow:hidden}
.square{display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(27px,8vw,45px);cursor:pointer;user-select:none}
.light{background:#f0d9b5}
.dark{background:#779556}
.selected{background:#e8d45b!important}
.white-piece{color:white;text-shadow:1px 2px 2px #333}
.black-piece{color:#20252b;text-shadow:0 1px 1px white}
.legal:after{content:"";position:absolute;width:23%;height:23%;border-radius:50%;background:#253b3580}
button{background:#8de0b2;color:#10251b;border:0;border-radius:8px;padding:12px 16px;margin:5px;font-weight:bold;font-size:15px}
button:disabled{opacity:.5}
.note{font-size:12px;color:#b8c5d1}
</style>
</head>
<body>
<h1>♟ Chess Arena</h1>
<p>Online Multiplayer Chess</p>
<div id="status">Connect to your chess server to begin.</div>
<div id="board"></div>
<button id="findBtn" onclick="findMatch()">Find Opponent</button>
<button onclick="flipBoard()">Flip Board</button>
<p class="note">Select a piece, then select its destination.</p><script>
const statusBox=document.getElementById("status");
const boardBox=document.getElementById("board");
const findBtn=document.getElementById("findBtn");

const game=new Chess();
const symbols={
 w:{k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"},
 b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}
};

let socket=null;
let gameId=null;
let myColor=null;
let selected=null;
let legalMoves=[];
let flipped=false;
let connected=false;

function setStatus(text){statusBox.textContent=text}

function connectServer(){
 if(socket) return;
 const serverUrl=prompt("Enter your deployed chess server URL (https://...)");
 if(!serverUrl) return;
 socket=io(serverUrl,{transports:["websocket","polling"]});

 socket.on("connect",()=>{
  connected=true;
  setStatus("Connected! Tap Find Opponent.");
  findBtn.disabled=false;
 });

 socket.on("connect_error",()=>{
  setStatus("Cannot connect. Check your server URL and hosting.");
 });

 socket.on("waiting",()=>{
  setStatus("Waiting for an opponent...");
 });

 socket.on("match_found",data=>{
  gameId=data.game_id;
  myColor=data.color==="white"?"w":"b";
  game.load(data.fen);
  selected=null;legalMoves=[];
  setStatus("Match found! You are "+data.color+".");
  socket.emit("join_game",{game_id:gameId});
  renderBoard();
 });

 socket.on("game_state",data=>{
  if(data.fen) game.load(data.fen);
  selected=null;legalMoves=[];
  renderBoard();
 });

 socket.on("error_message",data=>{
  setStatus(data.message||"An error occurred.");
 });
}

function findMatch(){
 if(!socket){connectServer();return}
 if(!connected){setStatus("Connecting to server...");return}
 gameId=null;myColor=null;
 game.reset();
 renderBoard();
 socket.emit("find_match");
 setStatus("Searching for an opponent...");
}

function renderBoard(){
 boardBox.innerHTML="";
 const files=flipped?["h","g","f","e","d","c","b","a"]:["a","b","c","d","e","f","g","h"];
 const ranks=flipped?[1,2,3,4,5,6,7,8]:[8,7,6,5,4,3,2,1];

 for(let ri=0;ri<8;ri++){
  for(let fi=0;fi<8;fi++){
   const file=files[fi],rank=ranks[ri],sq=file+rank;
   const el=document.createElement("div");
   el.className="square "+((ri+fi)%2===0?"light":"dark");
   if(selected===sq)el.classList.add("selected");
   if(legalMoves.some(m=>m.to===sq))el.classList.add("legal");

   const piece=game.get(sq);
   if(piece){
    const span=document.createElement("span");
    span.className=piece.color==="w"?"white-piece":"black-piece";
    span.textContent=symbols[piece.color][piece.type];
    el.appendChild(span);
   }
   el.onclick=()=>clickSquare(sq);
   boardBox.appendChild(el);
  }
 }
 updateStatus();
}

function clickSquare(sq){
 if(!gameId||!socket||!connected){
  setStatus("First connect to a deployed multiplayer server.");
  return;
 }
 if(game.isGameOver())return;
 if(game.turn()!==myColor){
  setStatus("Wait for your opponent's move.");
  return;
 }

 const piece=game.get(sq);
 const move=legalMoves.find(m=>m.to===sq);

 if(selected&&move){
  let uci=selected+sq;
  if(move.promotion)uci+="q";
  socket.emit("make_move",{game_id:gameId,move:uci});
  selected=null;legalMoves=[];
  return;
 }

 if(piece&&piece.color===myColor){
  selected=sq;
  legalMoves=game.moves({square:sq,verbose:true});
 }else{
  selected=null;legalMoves=[];
 }
 renderBoard();
}

function updateStatus(){
 if(game.isCheckmate()){
  setStatus("Checkmate! "+(game.turn()==="w"?"Black":"White")+" wins.");
 }else if(game.isDraw()){
  setStatus("Draw!");
 }else if(game.isCheck()){
  setStatus((game.turn()==="w"?"White":"Black")+" is in check.");
 }else if(gameId){
  setStatus((game.turn()===myColor?"Your":"Opponent's")+" turn ("+(game.turn()==="w"?"White":"Black")+")");
 }
}

function flipBoard(){flipped=!flipped;renderBoard()}

findBtn.disabled=false;
renderBoard();
</script></body>
</html>
